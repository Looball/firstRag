name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check GitHub Actions pins
        run: python3 scripts/check_github_actions_pins.py

      - name: Check tutorial documentation
        run: python3 scripts/check_tutorial_docs.py

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r backend/requirements.txt

      - name: Install OCR regression runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-chi-sim

      - name: Install Python dependency auditor
        run: python -m pip install pip-audit==2.10.1

      - name: Audit Python production dependencies
        run: python scripts/pip_audit_policy.py

      - name: Compile backend
        working-directory: backend
        run: python -m compileall app

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover tests -v

      - name: Restore PDF OCR history
        id: pdf-ocr-history
        continue-on-error: true
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: docs/evals/ocr_runs
          key: pdf-ocr-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pdf-ocr-${{ runner.os }}-${{ runner.arch }}-

      - name: Run PDF OCR regression gate
        run: |
          python scripts/eval_pdf_ocr.py \
            --history-dir docs/evals/ocr_runs \
            --trend-report docs/evals/latest_pdf_ocr_trend.md

      - name: Publish PDF OCR trend to job summary
        if: always()
        run: |
          if [[ -f docs/evals/latest_pdf_ocr_trend.md ]]; then
            cat docs/evals/latest_pdf_ocr_trend.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload PDF OCR reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdf-ocr-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/evals/latest_pdf_ocr_eval_report.json
            docs/evals/latest_pdf_ocr_eval_report.md
            docs/evals/latest_pdf_ocr_trend.md
          if-no-files-found: warn
          retention-days: 30

      - name: Check migration files
        run: python scripts/migrate_db.py --list

      - name: Check Docker Compose config
        run: docker compose config --quiet

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        run: python3 scripts/npm_audit_policy.py

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Run frontend E2E
        id: frontend_e2e
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload frontend E2E diagnostics
        if: failure() && steps.frontend_e2e.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: error
          retention-days: 14

  full-stack-e2e:
    name: Full-stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Run credential-free full-stack E2E
        id: full_stack_e2e
        run: scripts/run_full_stack_e2e.sh

      - name: Upload full-stack E2E diagnostics
        if: failure() && steps.full_stack_e2e.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-stack-e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report
            frontend/test-results
            tmp/full-stack-e2e
          if-no-files-found: error
          retention-days: 14

  container-security:
    name: Container OS Security
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build first-party images
        run: |
          docker build --file deploy/docker/backend.Dockerfile --tag firstrag-backend:ci .
          docker build --file deploy/docker/frontend.Dockerfile --tag firstrag-frontend:ci .

      - name: Scan backend OS packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: firstrag-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          severity: CRITICAL,HIGH
          scanners: vuln
          version: v0.72.0

      - name: Scan frontend OS packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: firstrag-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          severity: CRITICAL,HIGH
          scanners: vuln
          version: v0.72.0
          skip-setup-trivy: true
