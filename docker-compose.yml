name: firstrag

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-first_rag}
      POSTGRES_USER: ${POSTGRES_USER:-firstrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firstrag-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    command:
      - etcd
      - -advertise-client-urls=http://milvus-etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd_data:/etcd
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  milvus-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY:-firstrag-minio-local}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_KEY:-firstrag-minio-local-password}
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - milvus_minio_data:/minio_data
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 5

  milvus-standalone:
    image: milvusdb/milvus:v3.0.0
    restart: unless-stopped
    command: ["/bin/sh", "/opt/firstrag/milvus-entrypoint.sh"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-firstrag-minio-local}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-firstrag-minio-local-password}
      MQ_TYPE: woodpecker
      MILVUS_TOKEN: ${MILVUS_TOKEN:-root:firstrag-milvus-local-password}
    volumes:
      - milvus_data:/var/lib/milvus
      - ./deploy/docker/milvus-entrypoint.sh:/opt/firstrag/milvus-entrypoint.sh:ro
    mem_limit: ${MILVUS_MEMORY_LIMIT:-8g}
    cpus: ${MILVUS_CPU_LIMIT:-4.0}
    stop_grace_period: 2m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy

  milvus-health-probe:
    image: firstrag-backend:latest
    restart: "no"
    environment:
      MILVUS_URI: ${MILVUS_URI:-http://milvus-standalone:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-root:firstrag-milvus-local-password}
      MILVUS_DATABASE: ${MILVUS_DATABASE:-default}
      MILVUS_COLLECTION_PREFIX: ${MILVUS_COLLECTION_PREFIX:-firstrag}
      MILVUS_TIMEOUT_SECONDS: ${MILVUS_TIMEOUT_SECONDS:-10}
    command: ["python", "-m", "app.services.vectors.milvus_health"]
    logging: *default-logging
    depends_on:
      milvus-standalone:
        condition: service_healthy

  sparse-encoder:
    build:
      context: .
      dockerfile: deploy/docker/sparse-encoder.Dockerfile
      target: runtime
    image: firstrag-sparse-encoder:latest
    restart: unless-stopped
    environment:
      SPARSE_ENCODER_MODE: ${SPARSE_ENCODER_MODE:-bge_m3}
      SPARSE_ENCODER_MODEL: ${SPARSE_ENCODER_MODEL:-BAAI/bge-m3}
      SPARSE_ENCODER_REVISION: ${SPARSE_ENCODER_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      SPARSE_ENCODER_CACHE_DIR: /models/huggingface
      SPARSE_ENCODER_DEVICE: ${SPARSE_ENCODER_DEVICE:-cpu}
      SPARSE_ENCODER_USE_FP16: ${SPARSE_ENCODER_USE_FP16:-false}
      SPARSE_ENCODER_OFFLINE: ${SPARSE_ENCODER_OFFLINE:-false}
      SPARSE_ENCODER_BATCH_SIZE: ${SPARSE_ENCODER_BATCH_SIZE:-8}
      SPARSE_ENCODER_MAX_LENGTH: ${SPARSE_ENCODER_MAX_LENGTH:-1024}
      SPARSE_ENCODER_MAX_BATCH_SIZE: ${SPARSE_ENCODER_MAX_BATCH_SIZE:-16}
      SPARSE_ENCODER_MAX_TEXT_CHARACTERS: ${SPARSE_ENCODER_MAX_TEXT_CHARACTERS:-20000}
      SPARSE_ENCODER_MAX_REQUEST_BYTES: ${SPARSE_ENCODER_MAX_REQUEST_BYTES:-1048576}
      SPARSE_ENCODER_MAX_CONCURRENCY: ${SPARSE_ENCODER_MAX_CONCURRENCY:-1}
      SPARSE_ENCODER_REQUEST_TIMEOUT_SECONDS: ${SPARSE_ENCODER_REQUEST_TIMEOUT_SECONDS:-120}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_XET_CACHE: /models/huggingface/xet
      TRANSFORMERS_VERBOSITY: error
    volumes:
      - bge_m3_cache:/models/huggingface
    mem_limit: ${SPARSE_ENCODER_MEMORY_LIMIT:-8g}
    cpus: ${SPARSE_ENCODER_CPU_LIMIT:-4.0}
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8090/health/ready', timeout=5)",
        ]
      interval: 30s
      start_period: ${SPARSE_ENCODER_START_PERIOD:-30m}
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    image: firstrag-backend:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-firstrag}:${POSTGRES_PASSWORD:-firstrag-password}@postgres:5432/${POSTGRES_DB:-first_rag}}"
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      REDIS_COMMAND_TIMEOUT_SECONDS: ${REDIS_COMMAND_TIMEOUT_SECONDS:-1}
      VECTOR_WORKER_HEARTBEAT_TTL_SECONDS: ${VECTOR_WORKER_HEARTBEAT_TTL_SECONDS:-30}
      VECTOR_WORKER_FILE_LOCK_TTL_SECONDS: ${VECTOR_WORKER_FILE_LOCK_TTL_SECONDS:-900}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      RATE_LIMIT_REDIS_FAILURE_MODE: ${RATE_LIMIT_REDIS_FAILURE_MODE:-fail_closed}
      MILVUS_URI: ${MILVUS_URI:-http://milvus-standalone:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-root:firstrag-milvus-local-password}
      MILVUS_DATABASE: ${MILVUS_DATABASE:-default}
      MILVUS_COLLECTION_PREFIX: ${MILVUS_COLLECTION_PREFIX:-firstrag}
      MILVUS_TIMEOUT_SECONDS: ${MILVUS_TIMEOUT_SECONDS:-10}
      MILVUS_CONSISTENCY_LEVEL: ${MILVUS_CONSISTENCY_LEVEL:-Strong}
      SPARSE_ENCODER_URL: http://sparse-encoder:8090
      SPARSE_ENCODER_MODEL: ${SPARSE_ENCODER_MODEL:-BAAI/bge-m3}
      SPARSE_ENCODER_REVISION: ${SPARSE_ENCODER_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      SPARSE_ENCODER_CLIENT_TIMEOUT_SECONDS: ${SPARSE_ENCODER_CLIENT_TIMEOUT_SECONDS:-130}
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-/app/models/rerankers/bge-reranker-base}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
      - ${MODELS_DIR:-./models}:/app/models:ro
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      milvus-health-probe:
        condition: service_completed_successfully
      sparse-encoder:
        condition: service_healthy

  migrate:
    image: firstrag-backend:latest
    restart: "no"
    environment:
      DATABASE_URL: "${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-firstrag}:${POSTGRES_PASSWORD:-firstrag-password}@postgres:5432/${POSTGRES_DB:-first_rag}}"
    command: ["python", "/app/scripts/migrate_db.py"]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: firstrag-backend:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-firstrag}:${POSTGRES_PASSWORD:-firstrag-password}@postgres:5432/${POSTGRES_DB:-first_rag}}"
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-1}
      REDIS_COMMAND_TIMEOUT_SECONDS: ${REDIS_COMMAND_TIMEOUT_SECONDS:-1}
      VECTOR_WORKER_HEARTBEAT_TTL_SECONDS: ${VECTOR_WORKER_HEARTBEAT_TTL_SECONDS:-30}
      VECTOR_WORKER_FILE_LOCK_TTL_SECONDS: ${VECTOR_WORKER_FILE_LOCK_TTL_SECONDS:-900}
      MILVUS_URI: ${MILVUS_URI:-http://milvus-standalone:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-root:firstrag-milvus-local-password}
      MILVUS_DATABASE: ${MILVUS_DATABASE:-default}
      MILVUS_COLLECTION_PREFIX: ${MILVUS_COLLECTION_PREFIX:-firstrag}
      MILVUS_TIMEOUT_SECONDS: ${MILVUS_TIMEOUT_SECONDS:-10}
      MILVUS_CONSISTENCY_LEVEL: ${MILVUS_CONSISTENCY_LEVEL:-Strong}
      SPARSE_ENCODER_URL: http://sparse-encoder:8090
      SPARSE_ENCODER_MODEL: ${SPARSE_ENCODER_MODEL:-BAAI/bge-m3}
      SPARSE_ENCODER_REVISION: ${SPARSE_ENCODER_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      SPARSE_ENCODER_CLIENT_TIMEOUT_SECONDS: ${SPARSE_ENCODER_CLIENT_TIMEOUT_SECONDS:-130}
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-/app/models/rerankers/bge-reranker-base}
    command: ["python", "-m", "app.workers.vector_index_worker"]
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
      - ${MODELS_DIR:-./models}:/app/models:ro
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      milvus-health-probe:
        condition: service_completed_successfully
      sparse-encoder:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_ORIGIN: http://backend:8000
      BACKEND_API_PREFIX: ${BACKEND_API_PREFIX:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    logging: *default-logging
    depends_on:
      - backend

volumes:
  postgres_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
  bge_m3_cache:
